---
- name: Detect home directory of current user
  become: false
  shell: "echo $HOME"
  register: home_dir
  changed_when: false

- name: Get uid
  become: false
  shell: id -u
  register: uid

- name: Get gid
  become: false
  shell: id -g
  register: gid

- name: Ensure ~/.kube directory exists
  become: false
  file:
    path: "{{ home_dir.stdout }}/.kube"
    state: directory
    mode: '0755'

- name: Copy kubeconfig (admin.conf → .kube/config)
  copy:
    src: "{{ kube_config_dir }}/admin.conf"
    dest: "{{ home_dir.stdout }}/.kube/config"
    mode: "0600"
    remote_src: yes

- name: Change ownership of kubeconfig to current user
  file:
    path: "{{ home_dir.stdout }}/.kube/config"
    owner: "{{ uid.stdout }}"
    group: "{{ gid.stdout }}"
