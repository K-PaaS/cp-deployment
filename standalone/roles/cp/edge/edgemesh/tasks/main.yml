---
- name: Detect home directory of current user
  become: false
  shell: "echo $HOME"
  register: home_dir
  changed_when: false

- name: remove keadm token file
  file:
    path: "{{ home_dir.stdout }}/keadm_token"
    state: absent

- name: Add filter labels to Kubernetes API services
  shell: |
    kubectl label services kubernetes service.edgemesh.kubeedge.io/service-proxy-name=""
    kubectl label services cloudcore -n kubeedge service.edgemesh.kubeedge.io/service-proxy-name=""

- name: apply edgemesh crds
  shell: "kubectl apply -f {{ home_dir.stdout }}/cp-deployment/edge/edgemesh/crds/istio"

- name: apply edgemesh server
  shell: "kubectl apply -f {{ home_dir.stdout }}/cp-deployment/edge/edgemesh/agent/"

- name: patch edgemesh-agent
  shell: |
    kubectl patch daemonset edgemesh-agent -n kubeedge --patch-file {{ home_dir.stdout }}/cp-deployment/edge/manifest/tolerations.yaml
