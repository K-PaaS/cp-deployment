---
- name: Install iptables-persistent
  apt:
    name: iptables-persistent
    state: present
    update_cache: yes

- name: Apply NAT PREROUTING DNAT rules for Istio multi-cluster
  shell: |
    iptables -t nat -I PREROUTING -d {{ item.0 }} -j DNAT --to-destination {{ item.1 }}
  with_together:
    - "{{ istio_gateway_private_ip_list }}"
    - "{{ istio_gateway_public_ip_list }}"
  when: item.0 != item.1

- name: Configure netfilter-persistent systemd restart policy
  shell: |
    netfilter-persistent save
    cat <<EOF > /etc/systemd/system/netfilter-persistent.service.d/iptables.conf
    [Unit]
    Conflicts=iptables.service ip6tables.service
    [Service]
    Restart=on-failure
    RestartSec=5s
    EOF
    systemctl daemon-reload
